name: Uptime check

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled jobs, and this is not a
    # replacement for an external monitor, but it catches outages and keeps the
    # free Supabase database active between the six-hour keep-alive runs.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check API and database
        env:
          API_BASE: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE" ]; then echo "VITE_API_BASE_URL secret is missing"; exit 1; fi
          code=$(curl --silent --show-error --location --max-time 45 \
            --retry 3 --retry-delay 10 \
            --output /tmp/health.json --write-out '%{http_code}' \
            "$API_BASE/health?db=1")
          echo "HTTP $code"
          cat /tmp/health.json || true
          if [ "$code" != "200" ]; then exit 1; fi

      - name: Open incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'uptime';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });
            if (open.data.length) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `API health check failed at ${new Date().toISOString()}`,
              labels: [label],
              body: [
                'The scheduled uptime check could not get HTTP 200 from the health endpoint.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Check the Edge Function logs and the Supabase project status before closing this issue.',
              ].join('\n'),
            });

      - name: Close incident issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
              per_page: 10,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Health check recovered at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
