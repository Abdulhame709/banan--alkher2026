name: Keep-alive and monthly dues

on:
  schedule:
    # Four times a day. GitHub may delay scheduled jobs, so the external
    # uptime monitor documented in docs/التشغيل-الدائم.md is still recommended.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake database through Edge Function
        env:
          API_BASE: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE" ]; then echo "VITE_API_BASE_URL secret is missing"; exit 1; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$API_BASE/health?db=1"
          echo "Database is awake."

      - name: Touch database through REST RPC
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase URL or anon key secret is missing"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping_keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Keep-alive heartbeat recorded."

      - name: Post current Hijri month dues and month-end reminder
        env:
          API_BASE: ${{ secrets.VITE_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is missing"; exit 1; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$API_BASE/cron/dues"
          echo "Monthly dues task finished."
